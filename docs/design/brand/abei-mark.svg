<!-- 阿贝 abei · 主标志。海獭捧着一枚扇贝，从画幅下缘探出来。
     颜色固定：奶油 #E4D5B8 是身体，夜海 #14262C 是五官与描线。不跟 currentColor——
     形象只有「奶油在夜海上」这一种样子，浅底场景请垫一块夜海圆角方块（徽章式），
     不要反相换色。徽章做法：<rect width="128" height="128" rx="28" fill="#14262C"/>
     打底，再把本图放进 translate(4 2) scale(0.984)。
     24px 及以下改用 abei-mark-16.svg——胡须、嘴、贝壳沟纹和小手在那个尺寸会糊成一团。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 128" role="img" aria-label="阿贝">
  <g fill="#E4D5B8">
    <path d="M36,128 C34,104 40,74 60,74 C80,74 86,104 84,128 Z"/>
    <circle cx="20" cy="43" r="6.2"/>
    <circle cx="100" cy="43" r="6.2"/>
    <path d="M60,26 C84,26 100,37 101,52 C102,66 88,78 60,78 C32,78 18,66 19,52 C20,37 36,26 60,26 Z"/>
    <path d="M44,110 Q42,106 45.5,101.5 Q45.5,96.5 51,95 Q54,91 60,91 Q66,91 69,95 Q74.5,96.5 74.5,101.5 Q78,106 76,110 Q69,113.5 60,113.5 Q51,113.5 44,110 Z" stroke="#14262C" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="45" cy="95" r="6.3" stroke="#14262C" stroke-width="2"/>
    <circle cx="75" cy="95" r="6.3" stroke="#14262C" stroke-width="2"/>
  </g>
  <g fill="#14262C">
    <circle cx="41" cy="46.5" r="4"/>
    <circle cx="79" cy="46.5" r="4"/>
    <path d="M52,53 C52,50 68,50 68,53 C68,59 63,62.5 60,62.5 C57,62.5 52,59 52,53 Z"/>
  </g>
  <path d="M60,62.5 L60,66 M60,66 C57,69.5 52.5,69.5 50.5,67 M60,66 C63,69.5 67.5,69.5 69.5,67" stroke="#14262C" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M36,58 L26,56 M36,62 L25,63 M84,58 L94,56 M84,62 L95,63" stroke="#14262C" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M53,108 L51.5,100 M60,109 L60,97.5 M67,108 L68.5,100" stroke="#14262C" stroke-width="1.6" fill="none" stroke-linecap="round"/>
</svg>
