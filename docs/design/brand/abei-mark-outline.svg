<!-- 阿贝 abei · 主标志 描边版。奶油填充 + 夜海粗描边，直接放在浅色底上就成立，
     不用垫底。深色底上也读得出来（填充是浅的），所以页面里的 mark 一律用这份——
     两个前端都有暗色模式，底色会翻，描边版是唯一两边都稳的。
     纯剪影版见 abei-mark.svg，只在确定是夜海深底时用。
     favicon 和 1024 应用图标仍是徽章式（固定夜海底），见 abei-appicon.svg。

     注意：胸的路径底部伸到 y=132，越出 viewBox 是故意的——靠画幅裁掉底边那道描边，
     读作「从下缘探出来」。别把它改回 128，那样底下会多一条横线。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 128" role="img" aria-label="阿贝">
  <path d="M35,132 C33,104 40,76 60,76 C80,76 87,104 85,132 Z" fill="#EBDFC6" stroke="#14262C" stroke-width="5" stroke-linejoin="round"/>
