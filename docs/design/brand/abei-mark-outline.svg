  <circle cx="41" cy="47" r="5" fill="#14262C"/>
  <circle cx="79" cy="47" r="5" fill="#14262C"/>
  <circle cx="42.8" cy="45.2" r="1.7" fill="#FFF"/>
  <circle cx="80.8" cy="45.2" r="1.7" fill="#FFF"/>
  <path d="M51,52 C51,48.8 69,48.8 69,52 C69,58.5 63.5,62.5 60,62.5 C56.5,62.5 51,58.5 51,52 Z" fill="#14262C"/>
