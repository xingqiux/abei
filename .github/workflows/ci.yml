name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: ${{ matrix.project }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: abei-web
            directory: abei-web
            commands: npm run lint && npm run test:run && npm run check:colors && npm run check:contrast && npm run build
          - project: abei-agent
            directory: abei-agent
            commands: npm run typecheck && npm run lint && npm run format:check && npm run test:run && npm run build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.directory }}
      - run: ${{ matrix.commands }}
        working-directory: ${{ matrix.directory }}

  rust:
    name: abei checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: abei
      # 三道闸缺一不可，见 Makefile 的 test-rust。
      - run: cargo fmt --all -- --check
        working-directory: abei
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: abei
      - run: cargo test --workspace --all-features
        working-directory: abei

  backend:
    name: Firefly PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: make test-backend

  e2e:
    name: abei-web Playwright
    runs-on: ubuntu-latest
    # 要起真的 Firefly 加 abei-api（db + mail + app + abei-api 四个容器）再跑浏览器，
    # 比其他 job 慢，单列一个。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: abei-web/package-lock.json
      - run: npm ci
        working-directory: abei-web
      - run: npx playwright install --with-deps chromium
        working-directory: abei-web
      - run: make test-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: abei-web/test-results/
          retention-days: 7

  images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: [javascript, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: firefly-iii
            context: ./firefly-iii
            target: production
          - image: abei-api
            context: ./abei
            target: runtime
          - image: abei-web
            context: ./abei-web
            target: runtime
          - image: abei-agent
            context: ./abei-agent
            target: runtime
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          tags: local/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
