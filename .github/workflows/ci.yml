name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: ${{ matrix.project }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Abaku Web
            directory: abaku-web
            commands: npm run lint && npm run test:run && npm run check:colors && npm run check:contrast && npm run build
          - project: Firefly CLI
            directory: firefly-cli
            commands: npm run lint && npm run format:check && npm run test:run && npm run build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.directory }}
      - run: ${{ matrix.commands }}
        working-directory: ${{ matrix.directory }}

  backend:
    name: Firefly PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: make test-backend

  e2e:
    name: Abaku Web Playwright
    runs-on: ubuntu-latest
    # 要起真的 Firefly（db + mail + app 三个容器）再跑浏览器，比其他 job 慢，单列一个。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: abaku-web/package-lock.json
      - run: npm ci
        working-directory: abaku-web
      - run: npx playwright install --with-deps chromium
        working-directory: abaku-web
      - run: make test-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: abaku-web/test-results/
          retention-days: 7

  images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: [javascript]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: firefly-iii
            context: ./firefly-iii
            target: production
          - image: abaku-web
            context: ./abaku-web
            target: runtime
          - image: abaku-agent
            context: ./firefly-cli
            target: runtime
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          tags: local/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
