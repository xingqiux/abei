name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: ${{ matrix.project }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Granary Web
            directory: granary-web
            commands: npm run lint && npm run test:run && npm run build
          - project: Firefly CLI
            directory: firefly-cli
            commands: npm run lint && npm run format:check && npm run test:run && npm run build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.directory }}
      - run: ${{ matrix.commands }}
        working-directory: ${{ matrix.directory }}

  backend:
    name: Firefly PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: make test-backend

  images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: [javascript]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: firefly-iii
            context: ./firefly-iii
            target: production
          - image: granary-web
            context: ./granary-web
            target: runtime
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          tags: local/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
