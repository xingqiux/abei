name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-static:
    name: Rust fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.93
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: granary-server
      - run: cargo fmt --all --manifest-path granary-server/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets --manifest-path granary-server/Cargo.toml -- -D warnings

  server-tests:
    name: Granary PostgreSQL tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.93
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: granary-server
      - run: make test-server

  javascript:
    name: ${{ matrix.project }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Granary Web
            directory: granary-web
            commands: npm run lint && npm run test:run && npm run build
          - project: Firefly CLI
            directory: firefly-cli
            commands: npm run lint && npm run format:check && npm run test:run && npm run build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.directory }}
      - run: ${{ matrix.commands }}
        working-directory: ${{ matrix.directory }}

  compose-e2e:
    name: Granary Compose browser E2E
    runs-on: ubuntu-latest
    needs: [rust-static, server-tests, javascript]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose --env-file .env.example --profile e2e config --quiet
      - run: make test-e2e
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: granary-web/test-results/playwright
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    needs: [rust-static, javascript]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: granary-server
            context: ./granary-server
          - image: granary-web
            context: ./granary-web
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: local/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
