<!-- 阿贝 · favicon。徽章式：固定夜海圆角底 + 奶油海獭简化稿。
     标签页底色不受我们控制（浏览器亮暗主题都可能），所以这里必须自带底，
     不能像页面里那样用描边版裸放。
     用的是简化稿（无胡须/贝壳沟纹）——16px 上那些细节只会糊成脏点。
     源文件与其他形态见 docs/design/brand/。 -->
