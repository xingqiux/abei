# abei-admin 生产托管：静态 SPA + 同域反代 abei-api。
#
# 后台只需要 /v1 这一面。abei-web 那份还反代了 /api/ai（AI 流式）和 /api（Firefly REST），
# 这里刻意不开：后台不跑助手，也不该成为绕过 abei-api 直连 Firefly 的口子。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2;

    # Docker 内嵌 DNS；配合变量式 proxy_pass 把域名解析推迟到请求期，
    # 否则 abei-api 不可达时 nginx 启动即失败。
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream abei-api;

    # 用 ^~ 压过下面按扩展名匹配的正则 location，也不让 SPA fallback 吃掉。
    location ^~ /v1/ {
        proxy_pass http://$api_upstream:18002$request_uri;
        proxy_http_version 1.1;
        # 邮箱回灌、解析器批量重跑这类动作在服务端是同步的，比前台的读多写少要慢得多。
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html 不缓存，保证发新版后下一次导航就能拿到新的资产引用。
    location = /index.html {
        # location 中出现任意 add_header 后不会继承 server 级 header，安全项必须一起声明。
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache";
    }

    # 构建产物文件名带 hash，可以长缓存。
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico)$ {
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback：其余路径一律回退到 index.html，交给前端路由处理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
