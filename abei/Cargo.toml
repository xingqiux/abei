[workspace]
resolver = "3"
members = [
  "crates/abei-core",
  "crates/abei-api",
  "crates/abei-cli",
  "crates/abei-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
abei-core = { path = "crates/abei-core" }
async-http-proxy = { version = "1.2", features = ["basic-auth", "runtime-tokio"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.11"
deadpool-postgres = "0.14"
futures-util = "0.3"
mail-parser = { version = "0.11", features = ["full_encoding"] }
oauth2 = "5"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-postgres = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
