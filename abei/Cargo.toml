[workspace]
resolver = "3"
members = [
  "crates/abei-core",
  "crates/abei-api",
  "crates/abei-cli",
  "crates/abei-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
abei-core = { path = "crates/abei-core" }
async-http-proxy = { version = "1.2", features = ["basic-auth", "runtime-tokio"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.11"
calamine = "0.36"
csv = "1.4"
deadpool-postgres = "0.14"
encoding_rs = "0.8"
futures-util = "0.3"
globset = "0.4"
mail-parser = { version = "0.11", features = ["full_encoding"] }
oauth2 = "5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
rpassword = "7"
rhai = { version = "1.25", features = ["serde", "sync"] }
rust_decimal = { version = "1.42", features = ["serde"] }
schemars = "1"
scraper = { version = "0.27", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "8.2", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "time"] }

[profile.release]
lto = "thin"
strip = true
