[workspace]
resolver = "3"
members = ["crates/abei-core", "crates/abei-api", "crates/abei-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
abei-core = { path = "crates/abei-core" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"

[profile.release]
lto = "thin"
strip = true
