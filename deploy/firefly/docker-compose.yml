name: firefly-ai-accounting

services:
  app:
    image: ${FIREFLY_IMAGE}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FIREFLY_PORT:-18001}:80"
    volumes:
      - ./storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # 谷仓 Granary 新前端：纯静态 nginx，/api 与 /oauth 同域反代到 app（见 granary-web/nginx.conf）。
  # 反代域名建议指到这个端口；旧界面 app 保留原端口作过渡期兜底。
  granary-web:
    image: ${GRANARY_WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GRANARY_WEB_PORT:-18002}:80"

  cron:
    image: ${FIREFLY_IMAGE}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    command: sh -lc 'while true; do php artisan firefly-iii:cron || true; sleep 86400; done'
    volumes:
      - ./storage:/var/www/html/storage

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
