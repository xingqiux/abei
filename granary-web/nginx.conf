# granary-web 生产托管：静态 SPA + 反代 Firefly III API/OAuth。
# 反代目标 "app" 是 deploy/firefly/docker-compose.yml 里 firefly 应用服务的名字，
# 容器内监听 80（apache，见 firefly-iii/Dockerfile），granary-web 与它必须在同一个 compose 网络下。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2;

    # Docker 内嵌 DNS；配合变量式 proxy_pass 把域名解析推迟到请求期，
    # 否则 app 服务不可达时（比如单独 docker run 冒烟）nginx 启动即失败。
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $firefly_upstream app;

    # Firefly III REST API：/api/v1/... 同域反代，浏览器天然规避 CORS。
    location /api/ {
        proxy_pass http://$firefly_upstream:80$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth 相关端点（Passport），预留给未来授权码流程/令牌刷新场景。
    location /oauth/ {
        proxy_pass http://$firefly_upstream:80$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html 不缓存，保证发新版后用户下一次导航就能拿到新的资产引用。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 构建产物文件名带 hash，可以长缓存。
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback：其余路径一律回退到 index.html，交给前端路由处理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
