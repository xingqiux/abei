name: ${COMPOSE_PROJECT_NAME:-firefly-ai-accounting-dev}

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:${FIREFLY_PORT:-18001}}
  APP_KEY: ${APP_KEY:-SomeRandomStringOf32CharsExactly}
  TZ: ${TZ:-Asia/Shanghai}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-**}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-firefly}
  DB_USERNAME: ${POSTGRES_USER:-firefly}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-firefly-local-only}
  PGSQL_SCHEMA: public
  PGSQL_SSL_MODE: prefer
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync
  MAIL_MAILER: smtp
  MAIL_HOST: mail
  MAIL_PORT: 3025
  MAIL_USERNAME: ${MAIL_USERNAME:-bills}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-bills-local-only}
  MAIL_ENCRYPTION: "null"

x-mail-healthcheck: &mail-healthcheck
  test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/3025; exec 4<>/dev/tcp/127.0.0.1/3143"]
  interval: 2s
  timeout: 5s
  retries: 30
  start_period: 2s

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firefly}
      POSTGRES_USER: ${POSTGRES_USER:-firefly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firefly-local-only}
    volumes:
      - dev-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=${MAIL_USERNAME:-bills}:${MAIL_PASSWORD:-bills-local-only}@localhost
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-13025}:3025"
      - "127.0.0.1:${MAIL_IMAP_PORT:-13143}:3143"
    healthcheck: *mail-healthcheck

  app:
    build:
      context: ./firefly-iii
      target: production
    environment:
      <<: *app-environment
      FIREFLY_RUN_MIGRATIONS: "true"
      FIREFLY_GENERATE_OAUTH_KEYS: "true"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FIREFLY_PORT:-18001}:80"
    volumes:
      - app-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api/v1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  abaku-web:
    build:
      context: ./abaku-web
      target: runtime
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ABAKU_WEB_PORT:-18002}:80"

  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-firefly_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-firefly_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-firefly-test-only}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend-test:
    build:
      context: ./firefly-iii
      target: test
    profiles: [test]
    environment:
      <<: *app-environment
      APP_ENV: testing
      APP_DEBUG: "false"
      DEFAULT_LANGUAGE: en_US
      TZ: Europe/Amsterdam
      DB_HOST: test-db
      DB_DATABASE: ${TEST_POSTGRES_DB:-firefly_test}
      DB_USERNAME: ${TEST_POSTGRES_USER:-firefly_test}
      DB_PASSWORD: ${TEST_POSTGRES_PASSWORD:-firefly-test-only}
      MAIL_MAILER: log
      FIREFLY_GENERATE_OAUTH_KEYS: "true"
    depends_on:
      test-db:
        condition: service_healthy
    volumes:
      - ./firefly-iii/app:/var/www/html/app:ro
      - ./firefly-iii/config:/var/www/html/config:ro
      - ./firefly-iii/database:/var/www/html/database:ro
      - ./firefly-iii/resources:/var/www/html/resources:ro
      - ./firefly-iii/routes:/var/www/html/routes:ro
      - ./firefly-iii/tests:/var/www/html/tests:ro
      - ./firefly-iii/phpunit.xml:/var/www/html/phpunit.xml:ro
      - ./firefly-iii/mago.toml:/var/www/html/mago.toml:ro
    command: ["vendor/bin/phpunit", "--no-coverage"]

  cli-test:
    image: node:22-alpine
    profiles: [test]
    working_dir: /workspace
    volumes:
      - ./firefly-cli:/workspace
      - cli-node-modules:/workspace/node_modules
    command: ["sh", "-lc", "npm ci && npm run test:run"]

  web-test:
    image: node:22-alpine
    profiles: [test]
    working_dir: /workspace
    volumes:
      - ./abaku-web:/workspace
      - web-node-modules:/workspace/node_modules
    command: ["sh", "-lc", "npm ci && npm run test:run"]

  firefly-composer-audit:
    image: composer:2
    profiles: [test]
    working_dir: /workspace
    volumes:
      - ./firefly-iii:/workspace:ro
    command: ["audit", "--locked", "--no-interaction"]

  firefly-node-audit:
    image: node:25-alpine
    profiles: [test]
    working_dir: /workspace
    volumes:
      - ./firefly-iii:/workspace:ro
    command:
      - sh
      - -lc
      - |
        set -eu
        npm audit --omit=dev --audit-level=low --registry=https://registry.npmjs.org
        npm audit --audit-level=high --registry=https://registry.npmjs.org

volumes:
  app-storage:
  cli-node-modules:
  dev-postgres:
  web-node-modules:
