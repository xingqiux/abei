name: ${COMPOSE_PROJECT_NAME:-firefly-ai-accounting-dev}

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:${FIREFLY_PORT:-18001}}
  APP_KEY: ${APP_KEY:-SomeRandomStringOf32CharsExactly}
  TZ: ${TZ:-Asia/Shanghai}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-**}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-firefly}
  DB_USERNAME: ${POSTGRES_USER:-firefly}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-firefly-local-only}
  PGSQL_SCHEMA: public
  PGSQL_SSL_MODE: prefer
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync
  MAIL_MAILER: smtp
  MAIL_HOST: mail
  MAIL_PORT: 3025
  MAIL_USERNAME: ${MAIL_USERNAME:-bills}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-bills-local-only}
  MAIL_ENCRYPTION: "null"

x-mail-healthcheck: &mail-healthcheck
  test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/3025; exec 4<>/dev/tcp/127.0.0.1/3143"]
  interval: 2s
  timeout: 5s
  retries: 30
  start_period: 2s

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firefly}
      POSTGRES_USER: ${POSTGRES_USER:-firefly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firefly-local-only}
    volumes:
      - dev-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=${MAIL_USERNAME:-bills}:${MAIL_PASSWORD:-bills-local-only}@localhost
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-13025}:3025"
      - "127.0.0.1:${MAIL_IMAP_PORT:-13143}:3143"
    healthcheck: *mail-healthcheck

  app:
    build:
      context: ./firefly-iii
      target: production
    environment:
      <<: *app-environment
      FIREFLY_RUN_MIGRATIONS: "true"
      FIREFLY_GENERATE_OAUTH_KEYS: "true"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FIREFLY_PORT:-18001}:80"
    volumes:
      - app-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  granary-web:
    build:
      context: ./granary-web
      target: runtime
      args:
        VITE_LEGACY_URL: ${APP_URL:-http://localhost:${FIREFLY_PORT:-18001}}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GRANARY_WEB_PORT:-18002}:80"

  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-firefly_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-firefly_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-firefly-test-only}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend-test:
    build:
      context: ./firefly-iii
      target: test
    profiles: [test]
    environment:
      <<: *app-environment
      APP_ENV: testing
      APP_DEBUG: "false"
      DEFAULT_LANGUAGE: en_US
      TZ: Europe/Amsterdam
      DB_HOST: test-db
      DB_DATABASE: ${TEST_POSTGRES_DB:-firefly_test}
      DB_USERNAME: ${TEST_POSTGRES_USER:-firefly_test}
      DB_PASSWORD: ${TEST_POSTGRES_PASSWORD:-firefly-test-only}
      MAIL_MAILER: log
      FIREFLY_GENERATE_OAUTH_KEYS: "true"
    depends_on:
      test-db:
        condition: service_healthy
    volumes:
      - ./firefly-iii/app:/var/www/html/app:ro
      - ./firefly-iii/config:/var/www/html/config:ro
      - ./firefly-iii/database:/var/www/html/database:ro
      - ./firefly-iii/resources:/var/www/html/resources:ro
      - ./firefly-iii/routes:/var/www/html/routes:ro
      - ./firefly-iii/tests:/var/www/html/tests:ro
      - ./firefly-iii/phpunit.xml:/var/www/html/phpunit.xml:ro
      - ./firefly-iii/mago.toml:/var/www/html/mago.toml:ro
    command: ["vendor/bin/phpunit", "--no-coverage"]

  cli-test:
    image: node:22-alpine
    profiles: [test]
    working_dir: /workspace
    volumes:
      - ./firefly-cli:/workspace
      - cli-node-modules:/workspace/node_modules
    command: ["sh", "-lc", "npm ci && npm run test:run"]

  web-test:
    image: node:22-alpine
    profiles: [test]
    working_dir: /workspace
    volumes:
      - ./granary-web:/workspace
      - web-node-modules:/workspace/node_modules
    command: ["sh", "-lc", "npm ci && npm run test:run"]

  firefly-composer-audit:
    image: composer:2
    profiles: [test]
    working_dir: /workspace
    volumes:
      - ./firefly-iii:/workspace:ro
    command: ["audit", "--locked", "--no-interaction"]

  firefly-node-audit:
    image: node:25-alpine
    profiles: [test]
    working_dir: /workspace
    volumes:
      - ./firefly-iii:/workspace:ro
    command:
      - sh
      - -lc
      - |
        set -eu
        npm audit --omit=dev --audit-level=low --registry=https://registry.npmjs.org
        npm audit --audit-level=high --registry=https://registry.npmjs.org

  e2e-db:
    image: postgres:17-alpine
    profiles: [e2e]
    environment:
      POSTGRES_DB: firefly_e2e
      POSTGRES_USER: firefly_e2e
      POSTGRES_PASSWORD: firefly-e2e-only
    tmpfs:
      - /var/lib/postgresql/data
    networks: [e2e]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  e2e-mail:
    image: greenmail/standalone:2.1.3
    profiles: [e2e]
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=bills:bills-e2e-only@localhost
    networks: [e2e]
    healthcheck: *mail-healthcheck

  e2e-app:
    build:
      context: ./firefly-iii
      target: production
    profiles: [e2e]
    environment:
      <<: *app-environment
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://e2e-web
      DB_HOST: e2e-db
      DB_DATABASE: firefly_e2e
      DB_USERNAME: firefly_e2e
      DB_PASSWORD: firefly-e2e-only
      MAIL_HOST: e2e-mail
      MAIL_USERNAME: bills
      MAIL_PASSWORD: bills-e2e-only
      FIREFLY_RUN_MIGRATIONS: "true"
      FIREFLY_GENERATE_OAUTH_KEYS: "true"
    depends_on:
      e2e-db:
        condition: service_healthy
      e2e-mail:
        condition: service_healthy
    volumes:
      - e2e-app-storage:/var/www/html/storage
    networks:
      e2e:
        aliases: [app]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 60

  e2e-web:
    build:
      context: ./granary-web
      target: runtime
      args:
        VITE_LEGACY_URL: http://e2e-app
    profiles: [e2e]
    depends_on:
      e2e-app:
        condition: service_healthy
    networks: [e2e]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/index.html || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  e2e-seed:
    build:
      context: ./firefly-iii
      target: production
    profiles: [e2e]
    environment:
      <<: *app-environment
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_URL: http://e2e-web
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      DB_HOST: e2e-db
      DB_DATABASE: firefly_e2e
      DB_USERNAME: firefly_e2e
      DB_PASSWORD: firefly-e2e-only
      MAIL_HOST: e2e-mail
      MAIL_USERNAME: bills
      MAIL_PASSWORD: bills-e2e-only
    depends_on:
      e2e-app:
        condition: service_healthy
    volumes:
      - e2e-app-storage:/var/www/html/storage
      - e2e-secrets:/run/e2e
    networks: [e2e]
    command: ["sh", "-lc", "php artisan system:seed-e2e --send-mail && chown -R www-data:www-data storage"]

  cli-contract:
    image: node:22-alpine
    profiles: [e2e]
    working_dir: /workspace
    depends_on:
      e2e-seed:
        condition: service_completed_successfully
    volumes:
      - ./firefly-cli:/workspace
      - cli-contract-node-modules:/workspace/node_modules
      - e2e-secrets:/run/e2e:ro
    networks: [e2e]
    command:
      - sh
      - -lc
      - |
        set -eu
        npm ci
        npm run build
        node dist/cli.js --config /tmp/ffc-e2e.json auth set-token --profile e2e --url http://e2e-app --token "$$(cat /run/e2e/token)" >/dev/null
        node dist/cli.js --config /tmp/ffc-e2e.json --profile e2e ping
        crud_name="FFC E2E CRUD $$(date +%s)"
        crud_json="$$(node dist/cli.js --config /tmp/ffc-e2e.json --profile e2e --format json budgets create --name "$$crud_name")"
        crud_id="$$(node -e 'const value = JSON.parse(process.argv[1]); if (!value.data?.id) process.exit(1); process.stdout.write(String(value.data.id))' "$$crud_json")"
        cleanup() {
          if [ -n "$$crud_id" ]; then
            node dist/cli.js --config /tmp/ffc-e2e.json --profile e2e budgets delete "$$crud_id" >/dev/null 2>&1 || true
          fi
        }
        trap cleanup EXIT INT TERM
        read_json="$$(node dist/cli.js --config /tmp/ffc-e2e.json --profile e2e --format json budgets get "$$crud_id")"
        node -e 'const value = JSON.parse(process.argv[1]); if (String(value.data?.id) !== process.argv[2] || value.data?.attributes?.name !== process.argv[3]) process.exit(1)' "$$read_json" "$$crud_id" "$$crud_name"
        node dist/cli.js --config /tmp/ffc-e2e.json --profile e2e budgets delete "$$crud_id" >/dev/null
        if node dist/cli.js --config /tmp/ffc-e2e.json --profile e2e budgets get "$$crud_id" >/dev/null 2>&1; then
          echo "Deleted CLI contract budget is still readable" >&2
          exit 1
        fi
        crud_id=""

  e2e:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    profiles: [e2e]
    init: true
    working_dir: /workspace
    depends_on:
      cli-contract:
        condition: service_completed_successfully
      e2e-web:
        condition: service_healthy
    environment:
      E2E_BASE_URL: http://e2e-web
      E2E_TOKEN_PATH: /run/e2e/token
    volumes:
      - ./granary-web:/workspace
      - e2e-node-modules:/workspace/node_modules
      - e2e-secrets:/run/e2e:ro
    networks: [e2e]
    command: ["sh", "-lc", "npm ci && npm run test:e2e"]

volumes:
  app-storage:
  cli-contract-node-modules:
  cli-node-modules:
  dev-postgres:
  e2e-app-storage:
  e2e-node-modules:
  e2e-secrets:
  web-node-modules:

networks:
  e2e:
