name: ${COMPOSE_PROJECT_NAME:-firefly-ai-accounting-dev}

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_URL: ${APP_URL:-http://localhost:${FIREFLY_PORT:-18001}}
  APP_KEY: ${APP_KEY:-SomeRandomStringOf32CharsExactly}
  TZ: ${TZ:-Asia/Shanghai}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-**}
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-firefly}
  DB_USERNAME: ${POSTGRES_USER:-firefly}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-firefly-local-only}
  PGSQL_SCHEMA: public
  PGSQL_SSL_MODE: prefer
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync
  MAIL_MAILER: smtp
  MAIL_HOST: mail
  MAIL_PORT: 3025
  MAIL_USERNAME: ${MAIL_USERNAME:-bills}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-bills-local-only}
  MAIL_ENCRYPTION: "null"

x-mail-healthcheck: &mail-healthcheck
  test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/3025; exec 4<>/dev/tcp/127.0.0.1/3143"]
  interval: 2s
  timeout: 5s
  retries: 30
  start_period: 2s

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firefly}
      POSTGRES_USER: ${POSTGRES_USER:-firefly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firefly-local-only}
    volumes:
      - dev-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default
      - abei-feedback

  mail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=${MAIL_USERNAME:-bills}:${MAIL_PASSWORD:-bills-local-only}@localhost
    ports:
      - "127.0.0.1:${MAIL_SMTP_PORT:-13025}:3025"
      - "127.0.0.1:${MAIL_IMAP_PORT:-13143}:3143"
    healthcheck: *mail-healthcheck
    networks:
      - default
      - abei-server-egress

  app:
    build: &app-build
      context: ./firefly-iii
      target: production
    environment:
      <<: *app-environment
      FIREFLY_RUN_MIGRATIONS: "true"
      FIREFLY_GENERATE_OAUTH_KEYS: "true"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FIREFLY_PORT:-18001}:80"
    volumes:
      # 与 make dev 的本机 artisan 共用附件，切换运行方式不会丢失账单文件。
      - ./firefly-iii/storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/api/v1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 邮箱收取与 feedback 后端。没有宿主端口，也不和 agent 共享网络；
  # 只有 abei-api 能把已验证的 Firefly 身份递进来。
  abei-server:
    build:
      context: ./abei
      target: runtime
    entrypoint: ["abei-server"]
    environment:
      ABEI_SERVER_ADDR: 0.0.0.0:18005
      ABEI_DB_POOL_SIZE: ${ABEI_DB_POOL_SIZE:-5}
      ABEI_MAIL_STORAGE: /var/www/html/storage/app
      ABEI_MAIL_SYNC_INTERVAL: ${ABEI_MAIL_SYNC_INTERVAL:-300}
      ABEI_MAIL_TIMEOUT_SECONDS: ${ABEI_MAIL_TIMEOUT_SECONDS:-60}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-http://127.0.0.1:18004/oauth/google/callback}
      APP_KEY: ${APP_KEY:-SomeRandomStringOf32CharsExactly}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-firefly}
      POSTGRES_USER: ${POSTGRES_USER:-firefly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firefly-local-only}
      ABEI_LOG: ${ABEI_LOG:-info}
    depends_on:
      app:
        condition: service_healthy
      mail:
        condition: service_healthy
    expose:
      - "18005"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18005/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./firefly-iii/storage:/var/www/html/storage
    networks:
      - abei-feedback
      - abei-server-egress

  # 账本数据的统一 API 面。命令行、AI agent 和前端都只对着它说话。
  #
  # 18002 是这个服务的号，宿主机上直接发出来：`abei` 命令行、vite dev 的 /v1 代理和
  # playwright 都按 127.0.0.1:18002 找它，本机 cargo run 起的 abei-api 也用这个号。
  # 容器版和本机版因此二选一，`make dev`/`make dev-web` 会先停掉容器版。
  abei-api:
    build:
      context: ./abei
      target: runtime
    environment:
      # 容器内固定 18002；宿主侧映射端口才由 .env 的 ABEI_API_PORT 决定。
      ABEI_API_HOST: 0.0.0.0
      ABEI_API_PORT: 18002
      ABEI_WEB_URL: ${ABEI_WEB_URL:-http://127.0.0.1:${ABEI_WEB_PORT:-18004}}
      ABEI_SERVER_URL: http://abei-server:18005
      FIREFLY_URL: http://app
    depends_on:
      app:
        condition: service_healthy
      abei-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ABEI_API_PORT:-18002}:18002"
    # 镜像里自带 HEALTHCHECK，但那份是 30s 间隔的生产节奏；
    # 本地 `make up --wait` 要快，这里覆盖成密探测。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18002/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default
      - abei-feedback

  abei-agent:
    build:
      context: ./abei-agent
      target: runtime
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: 18003
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-gpt-5.4-mini}
      AI_DB_POOL_SIZE: ${AI_DB_POOL_SIZE:-5}
      APP_KEY: ${APP_KEY:-SomeRandomStringOf32CharsExactly}
      TZ: ${TZ:-Asia/Shanghai}
      FIREFLY_URL: http://app
      ABEI_API_URL: http://abei-api:18002
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-firefly}
      DB_USERNAME: ${POSTGRES_USER:-firefly}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-firefly-local-only}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_GATEWAY_ID: ${CLOUDFLARE_GATEWAY_ID:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ABEI_AGENT_PORT:-18003}:18003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18003/api/ai/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 5s
      retries: 20

  # nginx 静态站，同域把 /v1 反代给 abei-api、/api/ai 给 abei-agent、/api 给 Firefly。
  # 用 18004 而不是 18002：18002 是 abei-api 自己的号，两边抢会让本机开发起不来。
  abei-web:
    build:
      context: ./abei-web
      target: runtime
    depends_on:
      app:
        condition: service_healthy
      abei-api:
        condition: service_healthy
      abei-agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ABEI_WEB_PORT:-18004}:80"

  test-db:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-firefly_test}
      POSTGRES_USER: ${TEST_POSTGRES_USER:-firefly_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-firefly-test-only}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend-test:
    build:
      context: ./firefly-iii
      target: test
    profiles: [test]
    environment:
      <<: *app-environment
      APP_ENV: testing
      APP_DEBUG: "false"
      DEFAULT_LANGUAGE: en_US
      TZ: Europe/Amsterdam
      DB_HOST: test-db
      DB_DATABASE: ${TEST_POSTGRES_DB:-firefly_test}
      DB_USERNAME: ${TEST_POSTGRES_USER:-firefly_test}
      DB_PASSWORD: ${TEST_POSTGRES_PASSWORD:-firefly-test-only}
      MAIL_MAILER: log
      FIREFLY_GENERATE_OAUTH_KEYS: "true"
    depends_on:
      test-db:
        condition: service_healthy
    volumes:
      - ./firefly-iii/app:/var/www/html/app:ro
      - ./firefly-iii/config:/var/www/html/config:ro
      - ./firefly-iii/database:/var/www/html/database:ro
      - ./firefly-iii/resources:/var/www/html/resources:ro
      - ./firefly-iii/routes:/var/www/html/routes:ro
      - ./firefly-iii/tests:/var/www/html/tests:ro
      - ./firefly-iii/phpunit.xml:/var/www/html/phpunit.xml:ro
      - ./firefly-iii/mago.toml:/var/www/html/mago.toml:ro
    command: ["sh", "-lc", "exec php -d \"date.timezone=$${TZ}\" vendor/bin/phpunit --no-coverage"]

  agent-test:
    image: node:22-alpine
    profiles: [test]
    working_dir: /workspace
    volumes:
      - ./abei-agent:/workspace
      - agent-node-modules:/workspace/node_modules
    command: ["sh", "-lc", "npm ci && npm run test:run"]

  web-test:
    image: node:22-alpine
    profiles: [test]
    working_dir: /workspace
    volumes:
      - ./abei-web:/workspace
      - web-node-modules:/workspace/node_modules
    command: ["sh", "-lc", "npm ci && npm run test:run"]

  firefly-composer-audit:
    image: composer:2
    profiles: [test]
    working_dir: /workspace
    volumes:
      - ./firefly-iii:/workspace:ro
    command: ["audit", "--locked", "--no-interaction"]

  firefly-node-audit:
    image: node:25-alpine
    profiles: [test]
    working_dir: /workspace
    volumes:
      - ./firefly-iii:/workspace:ro
    command:
      - sh
      - -lc
      - |
        set -eu
        npm audit --omit=dev --audit-level=low --registry=https://registry.npmjs.org
        npm audit --audit-level=high --registry=https://registry.npmjs.org

volumes:
  agent-node-modules:
  dev-postgres:
  web-node-modules:

networks:
  abei-feedback:
    internal: true
  abei-server-egress:
